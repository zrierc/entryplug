creation_rules:
  - path_regex: "^secrets/.*$"
    key_groups:
      - age:
          - *entryplug

  - path_regex: '(^|/)(\.env(\..+)?|[^/]*\.env)$'
    key_groups:
      - age:
          - *entryplug

  - path_regex: '(^|/)([^/]*[._-])?\.?secrets?([._-][^/]*)?$'
