onboarding = false

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
last_pane = "prefix+a"
# cmd+… not alt+…: alt+h/l are AeroSpace's global focus chords
previous_tab = "cmd+h"
next_tab = "cmd+l"
goto = "prefix+s"
settings = "prefix+g"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "hrdr-sessionizer"
description = "jump to a project"

[[keys.command]]
key = "prefix+i"
type = "pane"
command = "hrdr-cheat"
description = "cheat sheet"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "hrdr-todo"
description = "todo buffer"

[ui]
sidebar_start_collapsed=true
tab_bar_position="bottom"

[ui.toast]
delivery = "terminal"
delay_seconds = 1
