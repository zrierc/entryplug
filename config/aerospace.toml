# i3 keybinding parity (unit-00's i3 config), mod = alt. Nothing is inherited
# from AeroSpace's defaults: this file is the whole keymap.
config-version = 2

# the store link is replaced on switch; auto-reload should pick that up,
# alt-shift-c is the reliable path if it does not
auto-reload-config = true
start-at-login = true

# auto-clean trees; chosen over i3's split keys, which AeroSpace's parser
# rejects alongside flatten normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

persistent-workspaces = []

# i3: mouse_warping none
on-focused-monitor-changed = []

# i3: focus_follows_mouse no
focus-follows-mouse.enabled = false

gaps.inner.horizontal = 5
gaps.inner.vertical = 5
gaps.outer.left = 3
gaps.outer.right = 3
gaps.outer.top = 3
gaps.outer.bottom = 3

[mode.main.binding]
alt-enter = "exec-and-forget open -na '/Applications/Nix Apps/Ghostty.app'"
alt-q = 'close'

# i3's focus order: the next window in the direction, else the adjacent
# monitor's visible workspace, else wrap inside the workspace
alt-h = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace right'

# i3 move semantics: move inside the tree, and at the workspace edge hand the
# window to the adjacent monitor (i3's move_to_output_directed). The absolute
# path is required: the brew shim keeps /opt/homebrew/bin off PATH.
alt-shift-h = 'exec-and-forget /opt/homebrew/bin/aerospace move left --boundaries-action fail || /opt/homebrew/bin/aerospace move-node-to-monitor left --focus-follows-window'
alt-shift-j = 'exec-and-forget /opt/homebrew/bin/aerospace move down --boundaries-action fail || /opt/homebrew/bin/aerospace move-node-to-monitor down --focus-follows-window'
alt-shift-k = 'exec-and-forget /opt/homebrew/bin/aerospace move up --boundaries-action fail || /opt/homebrew/bin/aerospace move-node-to-monitor up --focus-follows-window'
alt-shift-l = 'exec-and-forget /opt/homebrew/bin/aerospace move right --boundaries-action fail || /opt/homebrew/bin/aerospace move-node-to-monitor right --focus-follows-window'

alt-f = 'fullscreen'

alt-s = 'layout v_accordion'
alt-w = 'layout h_accordion'
alt-e = 'layout tiles horizontal vertical'

alt-shift-space = 'layout floating tiling'

alt-r = 'mode resize'
alt-shift-c = 'reload-config'

# i3 workspace semantics: an existing workspace keeps its display, a brand-new
# one opens on the display you are on. The helper is called by path because
# bindings run with PATH=/usr/bin:/bin:/usr/sbin:/sbin.
alt-1 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 1'
alt-2 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 2'
alt-3 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 3'
alt-4 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 4'
alt-5 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 5'
alt-6 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 6'
alt-7 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 7'
alt-8 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 8'
alt-9 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 9'
alt-0 = 'exec-and-forget "$HOME/.local/bin/aero-workspace" 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

# multi-monitor, no workspace pinning: focus the next monitor and move the
# current workspace there; --wrap-around so two monitors cycle both ways
alt-m = 'focus-monitor --wrap-around next'
alt-shift-m = 'move-workspace-to-monitor --wrap-around next'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'
